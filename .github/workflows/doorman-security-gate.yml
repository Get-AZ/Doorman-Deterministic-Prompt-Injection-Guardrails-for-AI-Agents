name: Doorman AI Security Regression Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression-gate:
    name: Red-Team & False-Positive Guardrail Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify 60-Vector Red-Team Corpus Integrity
        run: |
          python harness/generate_corpus.py
          git diff --exit-code harness/datasets/attack_corpus.json || (echo "::error::attack_corpus.json is out of sync with generate_corpus.py" && exit 1)

      - name: Run 60-Vector Red-Team Security Suite (ASR Gate)
        run: |
          python -m pytest harness/test_runner.py -v --tb=short

      - name: Run 100-Resume Benign False-Positive Gate (FPR Gate)
        run: |
          python harness/eval_false_positives.py | tee fpr_report.txt
          grep -q "Calculated False Positive Rate : 0.00%" fpr_report.txt || (echo "::error::False Positive Rate exceeded 0.00% threshold!" && exit 1)