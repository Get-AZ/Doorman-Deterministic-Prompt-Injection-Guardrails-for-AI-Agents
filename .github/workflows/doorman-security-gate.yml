name: Red-Team & False-Positive Guardrail Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        # Removed cache: 'pip' to prevent missing dependency file errors

    - name: Install Dependencies & Package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Run Unified Security Benchmark Suite
      run: |
        python run_benchmarks.py

    - name: Upload Benchmark Metrics Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-metrics-report
        path: harness/reports/benchmark_report.json
        retention-days: 30