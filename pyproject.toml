[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doorman"
version = "0.1.0"
description = "Prompt Injection Guardrails for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.6.0",
    "numpy>=1.26.0",
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
doorman-scan = "doorman.cli:main"

[tool.setuptools.packages.find]
include = ["doorman*", "harness*"]

[tool.setuptools.package-data]
doorman = ["data/anchors/*.json"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["."]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore: 'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore: datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning"
]