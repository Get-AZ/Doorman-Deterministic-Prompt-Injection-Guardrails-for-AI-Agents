[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doorman"
version = "0.1.0"
description = "Prompt Injection Guardrails for AI Recruiting Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["doorman*"]